<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Offline · Nova UI</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#070a12">
  <link rel="icon" href="/gudang/icon_logo/nova_logo.png" type="image/png">
  <style>
    /* Self-contained: this page must render with zero network access. */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(ellipse at 50% 0%, #151d36 0%, #0b1020 45%, #070a12 100%);
      color: #eaeefa;
      text-align: center;
    }

    .card {
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px
    }

    img {
      width: 96px;
      height: 96px;
      border-radius: 26px;
      box-shadow: 0 18px 48px rgba(0, 0, 0, .5)
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -.02em
    }

    p {
      color: #b3bed4;
      font-size: .92rem;
      line-height: 1.7
    }

    button {
      margin-top: 6px;
      padding: 13px 26px;
      min-height: 48px;
      border: none;
      border-radius: 9999px;
      background: #7c5cfc;
      color: #fff;
      font: inherit;
      font-weight: 700;
      font-size: .9rem;
      cursor: pointer;
      box-shadow: 0 10px 30px -10px rgba(124, 92, 252, .8);
      transition: transform .2s cubic-bezier(.16, 1, .3, 1), filter .2s;
    }

    button:hover {
      filter: brightness(1.08)
    }

    button:active {
      transform: scale(.97)
    }

    .hint {
      font-size: .76rem;
      color: #61708c
    }
  </style>
</head>

<body>
  <main class="card">
    <img src="/gudang/icon_logo/nova_logo.png" alt="Nova UI">
    <h1>You're offline</h1>
    <p>Nova UI can't reach the network right now. Pages you've already visited are still available from the cache.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <p class="hint">This page will reload automatically once you're back online.</p>
  </main>
  <script>
    // Reload the moment connectivity returns, so the user never has to.
    addEventListener('online', () => location.reload());
  </script>
</body>

</html>
