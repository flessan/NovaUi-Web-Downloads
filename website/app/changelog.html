<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Changelog - Nova UI</title>
  <meta name="description"
    content="Release notes, authors, assets and display-only download totals for every Nova UI release.">
  <meta name="robots" content="index,follow">
  <meta name="github-owner" content="DANZGAME-GD">
  <meta name="github-repo" content="NovaUI">
  <link rel="canonical" href="https://novaui-id.pages.dev/app/changelog.html">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://novaui-id.pages.dev/app/changelog.html">
  <meta property="og:title" content="Changelog - Nova UI">
  <meta property="og:description" content="Every Nova UI release, straight from GitHub.">
  <meta property="og:image" content="https://novaui-id.pages.dev/og-image.png">

  <!-- The shell module (cangkang.js) injects the PWA meta, manifest/icon
       and resource hints, and owns the shared navigation, footer and tab
       bar - one source of truth for every page. Render-blocking, no flash. -->
  <script src="../gudang/web/js/cangkang.js"></script>

  <link rel="stylesheet" href="../gudang/web/css/dohan.config.css">
  <link rel="stylesheet" href="../gudang/web/css/releases.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Comic+Neue:wght@700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print"
    onload="this.media='all'">
  <noscript>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  </noscript>

  <!-- cangkang.js also applies the saved shader-off class before paint. -->
</head>

<body>

  <!-- Shared app shell from cangkang.js: skip link, loader, floating
       controls, background canvas and header/navigation. -->
  <script>document.write(window.NOVA ? NOVA.shellBefore({ skip: '#changelog', loader: 'Loading changelog' }) : '')</script>

  <main class="release-shell">
    <div class="section-title">
      <div class="section-tag"><i class="fas fa-clock-rotate-left" aria-hidden="true"></i> GitHub releases</div>
      <h1>Changelog</h1>
      <p>Release notes, authors, assets and display-only download totals from the official repository.</p>
    </div>
    <div id="changelog" aria-live="polite"></div>
  </main>

  <!-- Shared footer and bottom tab bar, also from cangkang.js. -->
  <script>document.write(window.NOVA ? NOVA.shellAfter() : '')</script>


  <!-- The background shader GLSL is compiled inside webgl.js, so the
       page needs no inline shader source. -->
  <script type="module" src="../gudang/web/js/dohan.config.js"></script>
  <script type="module">
    import { renderChangelog } from '../gudang/web/js/github-releases.js';
    renderChangelog(document.querySelector('#changelog'));
  </script>
</body>

</html>
