<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Texture Packs - Nova UI</title>
  <meta name="description"
    content="Browse and download every Nova UI Geometry Dash texture pack. UI releases come from GitHub and Background Anime releases come from the official catalogue.">
  <meta name="robots" content="index,follow">
  <meta name="github-owner" content="DANZGAME-GD">
  <meta name="github-repo" content="NovaUI">
  <link rel="canonical" href="https://novaui-id.pages.dev/app/pack.html">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://novaui-id.pages.dev/app/pack.html">
  <meta property="og:title" content="Texture Packs - Nova UI">
  <meta property="og:description" content="Browse and download every Nova UI Geometry Dash texture pack.">
  <meta property="og:image" content="https://novaui-id.pages.dev/og-image.png">

  <!-- The shell module (cangkang.js) injects the PWA meta, manifest/icon
       and resource hints, and owns the shared navigation, footer and tab
       bar - one source of truth for every page. Render-blocking, no flash. -->
  <script src="../gudang/web/js/cangkang.js"></script>

  <link rel="stylesheet" href="../gudang/web/css/dohan.config.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Comic+Neue:wght@700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print"
    onload="this.media='all'">
  <noscript>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  </noscript>

  <!-- cangkang.js also applies the saved shader-off class before paint. -->
</head>

<body>

  <!-- Shared app shell from cangkang.js: skip link, loader, floating
       controls, background canvas and header/navigation. -->
  <script>document.write(window.NOVA ? NOVA.shellBefore({ skip: '#packs-section', loader: 'Loading packs' }) : '')</script>

  <main>
    <section id="packs-section" aria-labelledby="packs-title">
      <div class="section-title">
        <div class="section-tag"><i class="fas fa-th-large" aria-hidden="true"></i> Collection</div>
        <h1 id="packs-title">Texture packs</h1>
        <p>Nova UI downloads are fetched from GitHub Releases. Background Anime downloads remain in the official
          Spreadsheet catalogue.</p>
      </div>

      <div class="filter-shell">
        <input id="search" type="search" placeholder="Search by pack name or creator…" aria-label="Search texture packs"
          autocomplete="off">
      </div>

      <div class="filter-bar">
        <div class="filter-tags" role="group" aria-label="Filter packs by category">
          <button class="filter-tag active" type="button" data-filter="all" aria-pressed="true"
            onclick="setFilter('all',this)">All</button>
          <button class="filter-tag" type="button" data-filter="featured" aria-pressed="false"
            onclick="setFilter('featured',this)"><i class="fas fa-star" aria-hidden="true" style="font-size:.65em"></i>
            Featured</button>
          <button class="filter-tag" type="button" data-filter="ui" aria-pressed="false"
            onclick="setFilter('ui',this)">UI</button>
          <button class="filter-tag" type="button" data-filter="background" aria-pressed="false"
            onclick="setFilter('background',this)">Background Anime</button>
        </div>
        <div class="filter-right">
          <span class="search-count" id="searchCount" aria-live="polite"></span>
          <label class="visually-hidden" for="sortSelect">Sort packs</label>
          <select class="filter-sort" id="sortSelect" onchange="applySort()">
            <option value="featured">Featured first</option>
            <option value="name">Name A–Z</option>
            <option value="updated">Recently updated</option>
            <option value="downloads">Most downloaded</option>
          </select>
          <button class="refresh-packs" id="refreshPacks" type="button" aria-busy="false"
            aria-label="Refresh download data from GitHub Releases and the Background Anime Spreadsheet">
            <i class="fas fa-rotate-right" aria-hidden="true"></i>
            <span>Refresh</span>
          </button>
        </div>
      </div>

      <div id="packs" class="packs-grid" aria-live="polite" aria-busy="true"></div>
      <nav id="pagination" class="pagination" aria-label="Pack list pages"></nav>
    </section>
  </main>

  <!-- Shared footer and bottom tab bar, also from cangkang.js. -->
  <script>document.write(window.NOVA ? NOVA.shellAfter() : '')</script>


  <!-- The background shader GLSL is compiled inside webgl.js, so the
       page needs no inline shader source. -->
  <script type="module" src="../gudang/web/js/dohan.config.js"></script>
</body>

</html>
